<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="color-scheme" content="dark light">
<title>Admin | Faisal Hazary</title>
<style>
:root{--bg:#0f1011;--surface:#151617;--raised:#1b1c1e;--line:#26282b;--line2:#34373b;--fg:#ececea;--fg2:#b4b5b2;--fg3:#85878a;--accent:#f2a93b;--accent-fg:#1a1203;--bad:#ef6b5e;--ok:#6cc58a}
@media (prefers-color-scheme:light){:root{--bg:#f6f5f2;--surface:#fff;--raised:#efeeea;--line:#e2e0da;--line2:#cfcdc6;--fg:#1a1b1c;--fg2:#4a4c4f;--fg3:#74767a;--accent:#a35c00;--accent-fg:#fff;--bad:#b3261e;--ok:#17713a}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding:24px 16px 96px}
.center{min-height:100vh;display:grid;place-items:center;padding:16px}
.card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px}
.card h1{font-size:22px;margin-bottom:4px}
.muted{color:var(--fg3);font-size:13px}
label{display:block;font-size:13px;color:var(--fg2);margin:16px 0 4px}
input,select,textarea{width:100%;min-height:40px;padding:8px 12px;background:var(--bg);border:1px solid var(--line2);border-radius:10px}
textarea{min-height:72px;resize:vertical}
.btn{min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);background:transparent;font-weight:500}
.btn:hover{background:var(--raised)}
.btn.p{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.p:hover{filter:brightness(1.06)}
.btn.d{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.full{width:100%;margin-top:24px}
.msg{margin-top:16px;font-size:13px;min-height:20px}
.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.top h1{font-size:20px;flex:1}
.tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:transparent}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.row label{margin-top:0}
.ih{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ih strong{flex:1}
.sub{margin:16px 0 0;padding:12px;border:1px dashed var(--line2);border-radius:12px}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--raised);border:1px solid var(--line)}
.up{display:flex;gap:12px;align-items:center;margin-top:12px}
.up input{display:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.bar .msg{margin:0}
.key{display:inline-block;font:12px ui-monospace,"JetBrains Mono",monospace;padding:2px 8px;border-radius:6px;border:1px solid var(--line2);border-bottom-width:2px;color:var(--fg2)}
[hidden]{display:none!important}
</style>
</head>
<body>

<main class="center" id="vLogin" hidden>
 <form class="card" id="fLogin" method="post" action="#">
  <h1>Admin login</h1>
  <p class="muted">Faisal Hazary, private area.</p>
  <label for="lus">Username</label>
  <input id="lus" name="username" type="text" autocomplete="username" required>
  <label for="lpw">Password</label>
  <input id="lpw" name="password" type="password" autocomplete="current-password" required>
  <button class="btn p full" id="lbtn" type="submit">Log in</button>
  <p class="msg" id="lmsg" role="alert"></p>
 </form>
</main>

<div class="wrap" id="vApp" hidden>
 <div class="top">
  <h1>Admin</h1>
  <span class="key" id="idle"></span>
  <a class="btn" href="index.html" style="display:inline-flex;align-items:center;text-decoration:none;color:inherit">View site</a>
  <button class="btn" id="logout" type="button">Log out</button>
 </div>
 <div class="tabs" role="tablist">
  <button class="btn tab" role="tab" data-t="works" aria-selected="true">Works</button>
  <button class="btn tab" role="tab" data-t="brands" aria-selected="false">Brands</button>
  <button class="btn tab" role="tab" data-t="settings" aria-selected="false">Settings</button>
 </div>
 <section id="tWorks"></section>
 <section id="tBrands" hidden></section>
 <section id="tSettings" hidden></section>
 <div class="bar"><span class="msg" id="pmsg" role="status"></span><button class="btn p" id="publish" type="button">Publish changes</button></div>
</div>

<script src="admin.js"></script>
</body>
</html>
