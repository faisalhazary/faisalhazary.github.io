/* ===== animated background ===== */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg);pointer-events:none}

  -webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 25%,#000 10%,transparent 75%);mask-image:radial-gradient(ellipse 80% 70% at 50% 25%,#000 10%,transparent 75%);animation:gd 14s linear infinite}

/* ===== liquid glass navbar ===== */
.top{position:fixed;top:max(12px,env(safe-area-inset-top,0px));left:0;right:0;z-index:50;display:flex;justify-content:center;padding-inline:12px;pointer-events:none}
.gnav{--lx:30%;pointer-events:auto;position:relative;isolation:isolate;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;width:min(900px,100%);min-height:60px;padding:0 9px 0 20px;border-radius:999px;
  background:var(--glass);border:1px solid var(--glassbd);
  -webkit-backdrop-filter:blur(22px) saturate(190%) brightness(1.06);backdrop-filter:blur(22px) saturate(190%) brightness(1.06);
  box-shadow:inset 0 1.5px 0 var(--hi),inset 0 -1.5px 1px var(--glassin),inset 0 0 22px var(--glassin),0 14px 34px -10px var(--glassdrop),0 2px 6px rgba(0,0,0,.08);
  transition:height .3s,width .4s cubic-bezier(.2,.7,.2,1),box-shadow .3s}

  background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.5) 48%,transparent 60%);background-size:260% 100%;background-position:130% 0;animation:sheen 9s ease-in-out infinite;opacity:.55;mix-blend-mode:overlay}

/* ===== buttons, pills ===== */
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:14px;font-weight:700;border:1px solid var(--line);background:var(--surface);box-shadow:inset 0 1px 0 var(--hi);transition:transform .2s,filter .2s,border-color .2s,box-shadow .2s}

/* ===== hero ===== */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;padding-block:28px 56px}
.hero>*{min-width:0}
.eyebrow{display:inline-flex;align-items:center;gap:10px;margin-bottom:20px;padding:6px 14px 6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}

@keyframes ping{70%,100%{box-shadow:0 0 0 10px transparent}}
.hero h1{font-size:clamp(2.4rem,5.4vw,4.2rem);font-weight:700}
.hero h1 span{background:linear-gradient(90deg,var(--accent-ink),var(--violet),var(--cyan),var(--accent-ink));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gs 9s linear infinite}
@keyframes gs{to{background-position:-250% 0}}
.lead{color:var(--muted);font-size:1.08rem;max-width:54ch;margin-top:20px}

.stats div{display:flex;flex-direction:column;gap:2px}
.stats strong{font-family:var(--f-display);font-size:1.8rem;font-variant-numeric:tabular-nums}
.stagewrap{position:relative}
.stage{position:relative;aspect-ratio:1/1;border-radius:30px;border:1px solid var(--glassbd);overflow:hidden;background:radial-gradient(110% 80% at 50% 0%,var(--glow),transparent 70%),var(--surface);
  box-shadow:inset 0 1px 0 var(--hi),0 30px 60px -28px var(--glassdrop);
  transform:perspective(1000px) rotateY(calc(var(--px,0)*5deg)) rotateX(calc(var(--py,0)*-5deg));transition:transform .3s ease-out}
.stage img{width:100%;height:100%;object-fit:cover}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.stage .tag{position:absolute;left:18px;bottom:16px}
.fl{position:absolute;z-index:2;pointer-events:none;transform:translate3d(calc(var(--px,0)*-16px),calc(var(--py,0)*-16px),0);transition:transform .3s ease-out}
.fl-key{left:14px;bottom:14px}.fl-mouse{right:14px;top:14px}
.chip3d{padding:10px;border-radius:20px;background:var(--glass);border:1px solid var(--glassbd);-webkit-backdrop-filter:blur(14px) saturate(170%);backdrop-filter:blur(14px) saturate(170%);box-shadow:inset 0 1px 0 var(--hi),0 14px 28px -12px var(--glassdrop);animation:bob 6s ease-in-out infinite}
.fl-mouse .chip3d{animation-delay:-2.5s}
@keyframes bob{50%{translate:0 -9px}}
.wasd{display:grid;grid-template-columns:repeat(3,34px);gap:5px}
.k,.key{display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;color:var(--muted);border-radius:9px;border:1px solid var(--line);background:linear-gradient(180deg,var(--surface-2),var(--surface));box-shadow:0 3px 0 var(--line),inset 0 1px 0 var(--hi)}
.k{width:34px;height:34px;font-size:.8rem;animation:press 3.2s ease-in-out infinite}
.k-w{grid-column:2;animation-delay:0s}.k-a{grid-column:1;grid-row:2;animation-delay:.8s}.k-s{grid-column:2;grid-row:2;animation-delay:1.6s}.k-d{grid-column:3;grid-row:2;animation-delay:2.4s}
@keyframes press{0%,16%,100%{transform:none;color:var(--muted);box-shadow:0 3px 0 var(--line),inset 0 1px 0 var(--hi)}6%{transform:translateY(3px);color:var(--accent-ink);border-color:var(--accent-ink);box-shadow:0 0 0 var(--line),0 0 20px var(--glow)}}
.mouse{width:34px;height:auto;color:var(--fg);overflow:visible}
.mouse .body{fill:var(--surface);stroke:currentColor;stroke-width:2}
.mouse .ln{fill:none;stroke:currentColor;stroke-width:2;opacity:.6}

@keyframes whl{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}

.brand,.card,.panel,.item,.vcard{--mx:-300px;--my:-300px;background:radial-gradient(240px circle at var(--mx) var(--my),var(--spotc),transparent 70%),var(--surface);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--hi)}

.brand{display:flex;flex-direction:column;justify-content:space-between;gap:34px;min-height:220px;padding:26px;border-radius:24px;transition:border-color .25s,transform .25s,box-shadow .25s}
.brand:hover{border-color:var(--accent-ink);transform:translateY(-5px);box-shadow:inset 0 1px 0 var(--hi),0 26px 50px -26px var(--accent)}
.brand .meta{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:.9rem}
.brand .go{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-weight:700;transition:transform .25s}
.brand:hover .go{transform:translateX(4px) rotate(-8deg)}
.bl{display:flex;align-items:center;gap:14px;margin-top:14px;min-width:0}.blogo{width:60px;height:60px;flex:none;object-fit:cover;border-radius:16px;border:1px solid var(--line);box-shadow:0 8px 20px -10px var(--glassdrop)}.bl.big{margin-top:12px;gap:18px}.bl.big .blogo{width:84px;height:84px;border-radius:22px}.bl .mark{overflow-wrap:anywhere}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.card{padding:26px;border-radius:22px;display:flex;flex-direction:column;gap:10px;transition:border-color .25s,transform .25s}
.card:hover{border-color:var(--accent-ink);transform:translateY(-4px)}
.card .n{font-family:var(--f-mono);font-size:.78rem;color:var(--accent-ink);letter-spacing:.1em}
.card h3{font-size:1.2rem}
.card p{color:var(--muted);font-size:.95rem}
.card ul{margin:4px 0 0;padding-left:18px;color:var(--muted);font-size:.9rem}
.card li{margin-bottom:4px}
.fine{color:var(--muted);font-size:.88rem;margin-top:22px;max-width:70ch}

.featgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.card.feat{padding:30px;border-color:color-mix(in srgb,var(--accent-ink) 40%,var(--line))}
.card.feat h3{font-size:1.5rem}
@media (min-width:700px){.grid3>.card:only-child{max-width:calc(50% - 9px)}}
.incl{display:flex;gap:14px;align-items:center;margin-top:18px;padding:18px 22px;border-radius:20px}
.incl p{color:var(--fg)}
.tick{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-fg);font-weight:700}
.how{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;margin-top:18px;padding:22px 24px;border-radius:20px;border:1px dashed var(--line)}
.how p{max-width:56ch}
.plats{display:flex;flex-direction:column;gap:8px;margin-top:6px;padding-top:14px;border-top:1px solid var(--line)}
.plats .pbtn{cursor:default}
.ctop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stag{padding:3px 11px;border-radius:999px;background:var(--accent);color:var(--accent-fg);font-size:.74rem;font-weight:700}
/* gallery / products */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{border:1px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:999px;font-weight:600;font-size:.86rem;box-shadow:inset 0 1px 0 var(--hi)}
.chip:hover{border-color:var(--accent-ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.gallery,.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.item{display:flex;flex-direction:column;border-radius:20px;overflow:hidden;transition:border-color .25s,transform .25s,box-shadow .25s}
a.item:hover{border-color:var(--accent-ink);transform:translateY(-4px);box-shadow:inset 0 1px 0 var(--hi),0 22px 40px -24px var(--accent)}
.thumb{position:relative;aspect-ratio:4/5;background:var(--surface-2);overflow:hidden;display:grid;place-items:center;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
a.item:hover .thumb img{transform:scale(1.05)}
.thumb svg.ph{width:30%;opacity:.5}
.thumb .play{position:absolute;right:12px;bottom:12px;width:42px;height:42px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.thumb .play svg{width:14px;height:14px;fill:var(--accent-fg);margin-left:2px}
.badge{position:absolute;left:12px;top:12px;background:var(--bg);border:1px solid var(--line);padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:700}
.ibody{padding:16px;display:flex;flex-direction:column;gap:4px}
.ibody h3{font-size:1.02rem}
.ibody .meta{color:var(--muted);font-size:.84rem}
.empty{padding:36px;border:1px dashed var(--line);border-radius:20px;display:flex;flex-direction:column;gap:14px;background:var(--surface)}

/* product cards, viewer, analytics */
.thumb.p34{aspect-ratio:3/4;width:100%;border:0;padding:0;cursor:zoom-in}
div.thumb.p34{cursor:default}
.thumb.p34:hover img{transform:scale(1.05)}
.zoom{position:absolute;right:12px;bottom:12px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--glassbd);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-weight:700;color:var(--fg)}
.price{font-family:var(--f-display);font-size:1.5rem;font-weight:700;margin-top:6px}
.pn{font-size:.76rem}
.buy{margin-top:12px;justify-content:center;padding:11px 16px;font-size:.92rem}
.item.prod .ibody{flex:1}
.lb{position:fixed;inset:0;z-index:100;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr) auto;align-items:center;gap:8px 12px;padding:18px;background:rgba(4,7,16,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.lb[hidden]{display:none}
.lb figure{margin:0;grid-column:2;min-height:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.lb figure img{max-width:100%;max-height:calc(100% - 30px);object-fit:contain;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.lb figcaption{color:#cdd5ea}
.lbx{position:absolute;top:14px;right:16px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;font-size:1.6rem;line-height:1;z-index:2}
.lbn{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;font-size:1.8rem;line-height:1}
.lbn.prev{grid-column:1}.lbn.next{grid-column:3}
.lb.single .lbn{visibility:hidden}
.lbth{grid-column:1/-1;display:flex;gap:8px;justify-content:center;overflow-x:auto;padding-bottom:4px}
.lbt{flex:none;width:52px;height:68px;padding:0;border-radius:10px;overflow:hidden;border:2px solid transparent;background:none;opacity:.6}
.lbt.on{border-color:var(--accent);opacity:1}
.lbt img{width:100%;height:100%;object-fit:cover}
@media (max-width:640px){.lb{grid-template-columns:1fr 1fr;padding:12px}.lb figure{grid-column:1/-1;grid-row:1}.lbn.prev{grid-column:1;grid-row:2;justify-self:start}.lbn.next{grid-column:2;grid-row:2;justify-self:end}.lbth{grid-row:3}}
.chart{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:8px}
.cb{flex:1;height:100%;display:flex;align-items:flex-end;min-width:0}
.cb b{display:block;width:100%;background:linear-gradient(180deg,var(--accent),var(--violet));border-radius:6px 6px 2px 2px;min-height:2px}
.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:.74rem;margin-top:6px}
.table{margin-top:16px}
.tr{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:.9rem}
.tr.th{font-weight:700;color:var(--muted);border-top:0;font-size:.8rem}
.bar.wide{grid-template-columns:130px 1fr 90px}
.fetchmsg{color:var(--muted);font-size:.82rem;margin-left:8px}
.fetchmsg.err{color:#E5484D}
.ovc small{color:var(--muted);font-size:.8rem}

/* brand page */
.bhero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-top:10px;align-items:stretch}
.bhero.nos{grid-template-columns:1fr}
.bhero>*{min-width:0}
.bhero .bhead{margin-top:0;justify-content:center;min-height:260px}
.bside{border-radius:30px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:28px}
.bside.coupon{align-items:stretch;gap:14px;background:var(--glass);border:1px solid var(--glassbd);box-shadow:inset 0 1px 0 var(--hi),0 24px 50px -30px var(--glassdrop)}
.bside.coupon .off{font-size:2.6rem}
.logoside img{width:min(240px,70%);aspect-ratio:1;object-fit:cover;border-radius:40px;box-shadow:0 30px 60px -24px var(--glassdrop)}

@media (max-width:860px){.bhero,.showcase{grid-template-columns:1fr}.showcase{gap:44px;padding-top:40px}.vgrid.solo .vcard{margin-inline:auto}}

.coupon.mini{flex:0 0 auto;width:min(300px,100%);display:flex;flex-direction:column;gap:6px;padding:16px 18px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--hi)}

.products.solo,.vgrid.solo{grid-template-columns:1fr!important}

@media (max-width:640px){.vgrid.solo .vcard{flex-direction:column;align-items:stretch}.vgrid.solo .vcard .vbox{width:100%}.coupon.mini{width:100%}}
.bhead{display:flex;flex-direction:column;gap:16px;margin-top:10px;padding:30px;border-radius:30px}

.bchips{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:6px}

section.block[id^="b"]{scroll-margin-top:100px}
/* videos */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.vcard{display:flex;flex-direction:column;gap:12px;padding:12px;border-radius:22px}

.vbox:hover img{transform:scale(1.04)}
.vbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

.pbtn:hover{border-color:var(--accent-ink);color:var(--accent-ink)}

.contact{display:grid;grid-template-columns:.9fr 1.1fr;gap:36px;padding:38px;border-radius:30px;background:var(--glass);border:1px solid var(--glassbd);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);box-shadow:inset 0 1px 0 var(--hi),0 30px 60px -34px var(--glassdrop)}

form{display:grid;gap:14px}

.panel{padding:26px;border-radius:22px;display:flex;flex-direction:column;gap:12px}
.coupon .code{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border:1.5px dashed var(--accent-ink);border-radius:14px;background:color-mix(in srgb,var(--bg) 70%,transparent)}

/* animated login */

function igCode(u){var m=/instagram\.com\/(?:[\w.]+\/)?(?:reels?|p|tv)\/([\w-]+)/.exec(url(u));return m?m[1]:""}
function ttId(u){var m=/tiktok\.com\/.*\/video\/(\d+)/.exec(url(u));return m?m[1]:""}
function fbOk(u){return /^https:\/\/(www\.|m\.|web\.)?(facebook\.com|fb\.watch)\//i.test(url(u))}
function embedFor(r){
  var y=ytId(r.youtube); if(y) return {src:"https://www.youtube-nocookie.com/embed/"+y+"?autoplay=1&rel=0&playsinline=1"};
  var i=igCode(r.instagram); if(i) return {src:"https://www.instagram.com/p/"+i+"/embed"};
  var t=ttId(r.tiktok); if(t) return {src:"https://www.tiktok.com/embed/v2/"+t};
  if(fbOk(r.facebook)) return {src:"https://www.facebook.com/plugins/video.php?href="+encodeURIComponent(url(r.facebook))+"&show_text=false&autoplay=true"};
  return null;
}
function reelCard(r){
  var e=embedFor(r); if(!e) return "";
  var links=PLAT.filter(function(p){return url(r[p[1]])}).map(function(p){
    return '<a class="pbtn" data-pl="'+p[1]+'" href="'+esc(url(r[p[1]]))+'" target="_blank" rel="noopener noreferrer" aria-label="Open &quot;'+esc(r.title||"video")+'&quot; on '+p[0]+'">'+p[0]+'</a>'}).join("");
  var key="p"+(++pc); var hr=url(r.youtube)||url(r.instagram)||url(r.tiktok)||url(r.facebook)||""; PLAYERS[key]={src:e.src,title:r.title||"Video",href:hr,v:/shorts\/|\/reels?\/|tiktok\.com|instagram\.com/i.test(hr)};
  var y=ytId(r.youtube), th=img(r.thumb)||(y?"https://i.ytimg.com/vi/"+y+"/hqdefault.jpg":"");
  return '<div class="vcard"><button class="vbox" type="button" data-play="'+key+'" aria-label="Play video: '+esc(r.title||"video")+'">'
    +(th?'<img src="'+esc(th)+'" alt="" loading="lazy">':'')+'<span class="vplay">'+PLAY+'</span><span class="vlab">Tap to play</span></button>'
    +'<div><div class="vtitle">'+esc(r.title||"Video")+'</div>'+(has(r.date)?'<div class="meta mono">'+fmtDate(r.date)+'</div>':'')+'</div>'
    +'<div class="pbtns">'+links+'</div></div>';
}

/* ---------- inquiry form ---------- */
function composeMsg(f){
  var d=[].slice.call(f.querySelectorAll('input[name="deliverables"]:checked')).map(function(c){return c.value}).join(", ");
  var g=function(n){return f.elements[n].value.trim()};
  return {brand:g("brand"),subject:"Collab inquiry: "+g("brand"),
    body:"Hi Faisal,\n\nI would like to collaborate with you.\n\nBrand: "+g("brand")+"\nProduct: "+g("product")+"\nPackage: "+(d||"-")+"\nBudget: "+(g("budget")||"-")+"\nMessage: "+(g("message")||"-")+"\n"};
}
function sendInquiry(kind){
  var f=document.getElementById("inq"), st=document.getElementById("status");
  function show(cls,html){st.className="status "+cls;st.innerHTML=html}
  if(!f.elements.brand.value.trim()){show("err","Please enter your brand name.");f.elements.brand.focus();return}
  if(!f.elements.product.value.trim()){show("err","Please enter the product.");f.elements.product.focus();return}
  var m=composeMsg(f);
  if(kind==="gmail"&&has(SITE.contactEmail)){
    window.open("https://mail.google.com/mail/?view=cm&fs=1&to="+encodeURIComponent(SITE.contactEmail)+"&su="+encodeURIComponent(m.subject)+"&body="+encodeURIComponent(m.body),"_blank","noopener");
    show("ok","Gmail opened with your message. Press Send there to finish. <a href=\"mailto:"+esc(SITE.contactEmail)+"?subject="+encodeURIComponent(m.subject)+"&body="+encodeURIComponent(m.body)+"\">Use another email app</a>");
    return;
  }
  window.open("https://ig.me/m/"+encodeURIComponent(SITE.handle),"_blank","noopener");
  var ok=function(){show("ok","Your message was copied. Paste it into the Instagram chat and send it.")};
  var manual=function(){show("ok","Instagram opened. Copy this message and paste it into the chat:<br><textarea readonly rows=\"6\" style=\"margin-top:8px\">"+esc(m.body)+"</textarea>")};
  try{navigator.clipboard.writeText(m.body).then(ok,manual)}catch(e){manual()}
}
function submitForm(e){e.preventDefault();sendInquiry(has(SITE.contactEmail)?"gmail":"ig")}

function fields(fs,path,obj){
  return fs.map(function(f){
    if(f.t==="sec") return '<section class="sec wide"><div class="sh"><h3>'+esc(f.l)+'</h3>'+(f.d?'<p>'+esc(f.d)+'</p>':'')+'</div><div class="fgrid">'+fields(f.f,path,obj)+'</div></section>';

    var p=path?path+"."+f.k:f.k, v=obj[f.k], id="a-"+p.replace(/\./g,"-");
    if(f.t==="group") return '<fieldset class="gp wide"><legend>'+esc(f.l)+'</legend><div class="fgrid">'+fields(f.f,p,obj[f.k]||(obj[f.k]={}))+'</div></fieldset>';

function remembered(){try{return localStorage.getItem("fh-remember")==="1"}catch(e){return false}}
function secGet(k){try{return sessionStorage.getItem(k)||localStorage.getItem(k)||""}catch(e){return ""}}
function secSet(k,v){try{var r=remembered();(r?localStorage:sessionStorage).setItem(k,v);(r?sessionStorage:localStorage).removeItem(k);return true}catch(e){return false}}
function secDel(k){try{sessionStorage.removeItem(k);localStorage.removeItem(k)}catch(e){}}
function tokBadge(on){return on?'<span class="bd ok">'+(remembered()?'Saved in this browser':'Kept for this visit only')+'</span>':'<span class="bd">Not set</span>'}
function getTok(){return secGet("fh-token")}
function detectGh(){var h=location.hostname,o="",r="";if(/\.github\.io$/.test(h)){o=h.split(".")[0];var seg=location.pathname.split("/")[1];r=seg&&seg.indexOf(".")<0?seg:o+".github.io"}return {owner:o,repo:r}}
function ghc(){var g=SITE.github||{},d=detectGh();return {owner:String(g.owner||d.owner||"").trim(),repo:String(g.repo||d.repo||"").trim(),branch:String(g.branch||"main").trim(),path:String(g.path||"content.json").trim()}}
function ghFetch(c,p,o){
  o=o||{};var m=o.method||"GET";
  var h={"Accept":o.raw?"application/vnd.github.raw+json":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  var t=getTok();if(t)h.Authorization="Bearer "+t;if(o.body)h["Content-Type"]="application/json";
  var u="https://api.github.com/repos/"+encodeURIComponent(c.owner)+"/"+encodeURIComponent(c.repo)+"/contents/"+p.split("/").map(encodeURIComponent).join("/")+(m==="GET"?"?ref="+encodeURIComponent(c.branch)+"&t="+Date.now():"");
  return fetch(u,{method:m,headers:h,body:o.body?JSON.stringify(o.body):undefined});
}
function ghErr(r){
  return r.json().catch(function(){return {}}).then(function(j){
    if(r.status===401) return new Error("GitHub did not accept the token. Create a new token and save it again.");
    if(r.status===403) return new Error("GitHub refused this action. The token needs Contents: Read and write permission for this repository."+(j.message?" ("+j.message+")":""));
    if(r.status===404) return new Error("GitHub could not find that repository or file. Check the username, repository name and that the token has access to it.");
    if(r.status===409||r.status===422) return new Error("GitHub says the file changed meanwhile. Press Publish now once more."+(j.message?" ("+j.message+")":""));
    return new Error("GitHub error "+r.status+(j.message?": "+j.message:""));
  });
}
function b64(s){var b=new TextEncoder().encode(s),o="";for(var i=0;i<b.length;i+=8192)o+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(o)}
function ghStatus(cls,t){var s=document.getElementById("ghstatus");if(s){s.className="status "+cls;s.textContent=t}}
async function prepPublish(c){
  var copy=JSON.parse(JSON.stringify(SITE)), map={};
  (function walk(o){Object.keys(o).forEach(function(k){var v=o[k];
    if(typeof v==="string"&&/^data:image\/(png|jpe?g|webp|gif);base64,/i.test(v)){
      if(!map[v]){var h=v.slice(0,24).toLowerCase(),ext=h.indexOf("png")>0?"png":h.indexOf("webp")>0?"webp":h.indexOf("gif")>0?"gif":"jpg";map[v]="assets/img-"+h53(v)+"."+ext}
      o[k]=map[v];
    } else if(v&&typeof v==="object") walk(v)})})(copy);
  var list=Object.keys(map), n=0;
  for(var i=0;i<list.length;i++){
    var d=list[i], p=map[d], ex=await ghFetch(c,p);
    if(ex.status===404){var up=await ghFetch(c,p,{method:"PUT",body:{message:"Add image from dashboard",content:d.split(",")[1],branch:c.branch}});if(!up.ok)throw await ghErr(up)}
    else if(!ex.ok) throw await ghErr(ex);
    n++;ghStatus("info","Uploading images "+n+" of "+list.length+"...");
  }
  return copy;
}
async function putFile(c,path,b64s,msg){
  var cur=await ghFetch(c,path), sha;
  if(cur.ok) sha=(await cur.json()).sha; else if(cur.status!==404) throw await ghErr(cur);
  var put=await ghFetch(c,path,{method:"PUT",body:{message:msg,content:b64s,branch:c.branch,sha:sha}});
  if(!put.ok) throw await ghErr(put);
}
async function ghPublish(htmlText){
  var c=ghc(), btn=document.getElementById("ghpub");
  if(!getTok()){ghStatus("err","Paste and save your GitHub token first (step 2 below).");return}
  if(!c.owner||!c.repo){ghStatus("err","Enter your GitHub username and repository name.");return}
  if(btn)btn.disabled=true; ghStatus("info","Publishing...");
  try{
    var copy=await prepPublish(c);
    await putFile(c,c.path,b64(JSON.stringify(copy,null,2)),"Update site content from dashboard");
    if(htmlText){ghStatus("info","Publishing the HTML file...");await putFile(c,String((SITE.github||{}).htmlPath||"index.html").trim()||"index.html",b64(htmlText),"Update website file from dashboard")}
    DIRTY=false;try{localStorage.removeItem("fh-dirty")}catch(e){}paintDirty();
    try{localStorage.setItem("fh-lastpub",String(Date.now()))}catch(e){}var bk="";if(homeAuto()){try{await homeSyncAfterPublish(htmlText);bk=" A backup was saved in your private repository."}catch(e2){bk=" (The backup in your private repository did not work: "+homeErr(e2)+")"}}
    ghStatus("ok","Published"+(htmlText?" (updates and the HTML file)":"")+". Your website updates by itself in about 1 to 2 minutes. No upload needed."+bk);
  }catch(e){ghStatus("err",e.message||"Publishing failed. Check your internet connection and try again.")}
  if(btn)btn.disabled=false;
}
function pickHtml(cb){

  i.onchange=function(){var f=i.files&&i.files[0];if(!f)return;
    if(f.size>5e6){toast("That file is too big for a website page.");return}
    var r=new FileReader();r.onload=function(){var t=String(r.result||"");
      if(!/<!doctype html/i.test(t)||!/<\/html>/i.test(t)||t.indexOf("var SITE")<0){ghStatus("err","That file does not look like your website file (index.html). Nothing was published.");return}
      cb(t)};r.readAsText(f)};
  i.click();
}

    var c=o.goatcounter||{}; if(typeof c.code==="string"&&c.code){SITE.analytics=SITE.analytics||{};SITE.analytics.code=c.code} ss("fh-gctoken",c.token);
